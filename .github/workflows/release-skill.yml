name: Release Clean Language Skill

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate skill structure
        shell: bash
        run: |
          set -euo pipefail
          test -f clean-language/SKILL.md
          test -d clean-language/references
          grep -Eq '^name:[[:space:]]*clean-language[[:space:]]*$' clean-language/SKILL.md
          if find clean-language -type f \( -name '*.py' -o -name '*.js' -o -name '*.sh' -o -name '*.exe' -o -name '*.dll' \) | grep -q .; then
            echo "Unexpected executable or script content found in the skill package."
            exit 1
          fi

      - name: Build deterministic ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          zip -r -X dist/clean-language.zip \
            clean-language/SKILL.md \
            clean-language/references \
            -x '*/.DS_Store' '*/__MACOSX/*' '*/.git*'
          cd dist
          sha256sum clean-language.zip > clean-language.zip.sha256

      - name: Verify archive layout
        shell: bash
        run: |
          set -euo pipefail
          entries=$(unzip -Z1 dist/clean-language.zip)
          echo "${entries}"
          top=$(printf '%s\n' "${entries}" | cut -d/ -f1 | sort -u)
          test "${top}" = "clean-language"
          printf '%s\n' "${entries}" | grep -qx 'clean-language/SKILL.md'
          printf '%s\n' "${entries}" | grep -q '^clean-language/references/'
          if printf '%s\n' "${entries}" | grep -qiE 'DS_Store|__MACOSX|/\.git'; then
            echo "Unexpected artefact found in archive."
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # A manual dispatch releases the checked-out commit under RELEASE_TAG,
          # moving the tag there if it already exists. A tag push leaves the tag
          # where it was pushed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git tag -f "${RELEASE_TAG}" "${GITHUB_SHA}"
            git push --force origin "refs/tags/${RELEASE_TAG}"
          elif ! git rev-parse "${RELEASE_TAG}" >/dev/null 2>&1; then
            git tag "${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              dist/clean-language.zip \
              dist/clean-language.zip.sha256 \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              dist/clean-language.zip \
              dist/clean-language.zip.sha256 \
              --title "Clean Language ${RELEASE_TAG}" \
              --generate-notes
          fi